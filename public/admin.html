<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de control - AlbinegrosCastellón</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      color: #111;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 14px;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .success {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<button onclick="logout()" style="float:right; background:#c62828;">
  Cerrar sesión
</button>

  <h1>Panel de control básico</h1>

  <div class="card">
    <h2>Próximo partido</h2>

    <label>Logo equipo (URL)</label>
    <input id="teamLogo" />

    <label>Logo rival (URL)</label>
    <input id="opponentLogo" />

    <label>Equipo</label>
    <input id="teamName" />

    <label>Rival</label>
    <input id="opponent" />

    <label>Fecha</label>
    <input id="date" />

    <label>Hora</label>
    <input id="time" />

    <label>Estadio</label>
    <input id="stadium" />

    <label>Competición</label>
    <input id="competition" />

    <button onclick="saveNextMatch()">Guardar próximo partido</button>
    <div id="nextMatchMsg" class="success"></div>
  </div>

  <div class="card">
  <h2>¿Quiénes somos?</h2>

  <h3>Nuestra historia</h3>

  <label>Título</label>
  <input id="aboutTitle" />

  <label>Historia</label>
  <textarea id="aboutText" rows="8"></textarea>

  <hr style="margin:24px 0;" />

  <h3>Equipo</h3>

  <label>Fundador</label>
  <input id="founderName" placeholder="Víctor Jara" />

  <label>Cargo del fundador</label>
  <input
    id="founderRole"
    placeholder="Fundador y creador de Albinegros Castellón"
  />

  <label>Descripción del fundador</label>
  <textarea id="founderText" rows="4"></textarea>

  <label>Socio</label>
  <input id="partnerName" placeholder="Andros Martínez" />

  <label>Cargo del socio</label>
  <input
    id="partnerRole"
    placeholder="Socio de Albinegros Castellón"
  />

  <label>Descripción del socio</label>
  <textarea id="partnerText" rows="4"></textarea>

  <hr style="margin:24px 0;" />

  <h3>Colabora con nosotros</h3>

  <label>Título comercial</label>
  <input
    id="collaborateTitle"
    placeholder="¿Quieres que tu negocio llegue a miles de personas?"
  />

  <label>Texto introductorio</label>
  <textarea id="collaborateText" rows="5"></textarea>

  <label>Visualizaciones mensuales</label>
  <input id="monthlyViews" placeholder="3000000" />

  <label>Seguidores totales</label>
  <input id="totalFollowers" placeholder="24000" />

  <label>Seguidores en Instagram</label>
  <input id="instagramFollowers" placeholder="17000" />

  <label>Servicios / posibilidades de colaboración</label>
  <textarea
    id="collaborateServices"
    rows="5"
    placeholder="Publicidad en app, web, redes sociales, stories, sorteos..."
  ></textarea>

  <label>Email de contacto</label>
  <input
    id="contactEmail"
    placeholder="contacto@albinegroscastellon.com"
  />

  <hr style="margin:24px 0;" />

  <h3>Nuestras redes</h3>

  <label>Instagram - seguidores</label>
  <input id="socialInstagramFollowers" />

  <label>Instagram - enlace</label>
  <input id="socialInstagramUrl" placeholder="https://..." />

  <label>Facebook - seguidores</label>
  <input id="socialFacebookFollowers" />

  <label>Facebook - enlace</label>
  <input id="socialFacebookUrl" placeholder="https://..." />

  <label>X - seguidores</label>
  <input id="socialXFollowers" />

  <label>X - enlace</label>
  <input id="socialXUrl" placeholder="https://..." />

  <label>TikTok - seguidores</label>
  <input id="socialTiktokFollowers" />

  <label>TikTok - enlace</label>
  <input id="socialTiktokUrl" placeholder="https://..." />

  <button onclick="saveAbout()">Guardar sección</button>
  <div id="aboutMsg" class="success"></div>
</div>

<div class="card">
  <h2>Última hora</h2>

  <label>Texto del ticker</label>
  <input
    id="tickerText"
    placeholder="Escribe aquí la noticia de última hora"
  />

  <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
    <input
      id="tickerActive"
      type="checkbox"
      style="width:auto;"
    />
    Mostrar ticker en Inicio
  </label>

  <button onclick="saveTicker()">Guardar última hora</button>

  <div id="tickerMsg" class="success"></div>
</div>

  <div class="card">
  <h2>Publicidad</h2>

  <label>Imagen (URL)</label>
  <input id="adImage" placeholder="https://..." />

  <label>Título</label>
  <input id="adTitle" placeholder="Título del anuncio" />

  <label>Texto</label>
  <input id="adText" placeholder="Descripción del anuncio" />

  <label>Link</label>
  <input id="adLink" placeholder="https://..." />

  <button onclick="addAd()">Añadir publicidad</button>

  <div id="adsMsg" class="success"></div>

  <h3>Publicidad actual</h3>
  <div id="adsList"></div>
</div>
<div class="card">
  <h2>Clasificación</h2>

  <textarea id="standingsJson" rows="14"></textarea>

  <button onclick="saveStandings()">Guardar clasificación</button>
  <div id="standingsMsg" class="success"></div>
</div>

<div class="card">
  <h2>Calendario</h2>

  <textarea id="calendarJson" rows="14"></textarea>

  <button onclick="saveCalendar()">Guardar calendario</button>
  <div id="calendarMsg" class="success"></div>
</div>

<div class="card">
  <h2>Noticias</h2>

  <textarea id="newsJson" rows="14"></textarea>

  <button onclick="saveNews()">Guardar noticias</button>
  <div id="newsMsg" class="success"></div>
</div>

<div class="card">
  <h2>Galería</h2>

  <label>Título</label>
  <input id="galleryTitle" placeholder="Ej: Wallpaper Castalia" />

  <label>Categoría</label>
  <select id="galleryCategory">
  <option value="castalia">Castalia</option>
  <option value="desplazamientos">Desplazamientos</option>
  <option value="vintage">Vintage</option>
  <option value="fondos">Fondos</option>
</select>

  <label>Tipo</label>
  <select id="galleryType">
    <option value="">Normal</option>
    <option value="Móvil">Móvil</option>
    <option value="Poster">Poster</option>
    <option value="Pantalla">Pantalla</option>
  </select>

  <label>URL imagen</label>
  <input id="galleryImage" placeholder="https://www.albinegroscastellon.com/images/gallery/..." />

  <button onclick="addGalleryImage()">Añadir imagen</button>
 

  <div id="galleryMsg" class="success"></div>

  <h3>Imágenes actuales</h3>
  <div id="galleryList"></div>
</div>


  <script>

let galleryItems = [];
let adsItems = [];

function logout() {
  fetch('/admin.html', {
    headers: {
      Authorization: 'Basic ' + btoa('logout:logout')
    }
  }).finally(() => {
    window.location.href = '/admin.html';
  });
}
  async function loadData() {
    try {
const calendarRes = await fetch('/api/admin/calendar');
const calendar = await calendarRes.json();
document.getElementById('calendarJson').value = JSON.stringify(calendar, null, 2);
const standingsRes = await fetch('/api/admin/standings');
const standings = await standingsRes.json();
document.getElementById('standingsJson').value = JSON.stringify(standings, null, 2);      
const nextMatchRes = await fetch('/api/admin/next-match');
const nextMatch = await nextMatchRes.json();

      document.getElementById('teamName').value = nextMatch.teamName || '';
      document.getElementById('opponent').value = nextMatch.opponent || '';
      document.getElementById('date').value = nextMatch.date || '';
      document.getElementById('time').value = nextMatch.time || '';
      document.getElementById('stadium').value = nextMatch.stadium || '';
      document.getElementById('competition').value = nextMatch.competition || '';
      document.getElementById('teamLogo').value = nextMatch.teamLogo || '';
      document.getElementById('opponentLogo').value = nextMatch.opponentLogo || '';

const aboutRes = await fetch('/api/admin/about');
const about = await aboutRes.json();

document.getElementById('aboutTitle').value =
  about.history?.title || about.title || '';

document.getElementById('aboutText').value =
  about.history?.text || about.text || '';

document.getElementById('founderName').value =
  about.team?.founderName || '';

document.getElementById('founderRole').value =
  about.team?.founderRole || '';

document.getElementById('founderText').value =
  about.team?.founderText || '';

document.getElementById('partnerName').value =
  about.team?.partnerName || '';

document.getElementById('partnerRole').value =
  about.team?.partnerRole || '';

document.getElementById('partnerText').value =
  about.team?.partnerText || '';

document.getElementById('collaborateTitle').value =
  about.collaborate?.title || '';

document.getElementById('collaborateText').value =
  about.collaborate?.text || '';

document.getElementById('monthlyViews').value =
  about.collaborate?.monthlyViews || '';

document.getElementById('totalFollowers').value =
  about.collaborate?.totalFollowers || '';

document.getElementById('instagramFollowers').value =
  about.collaborate?.instagramFollowers || '';

document.getElementById('collaborateServices').value =
  about.collaborate?.services || '';

document.getElementById('contactEmail').value =
  about.collaborate?.contactEmail || '';

document.getElementById('socialInstagramFollowers').value =
  about.socials?.instagram?.followers || '';

document.getElementById('socialInstagramUrl').value =
  about.socials?.instagram?.url || '';

document.getElementById('socialFacebookFollowers').value =
  about.socials?.facebook?.followers || '';

document.getElementById('socialFacebookUrl').value =
  about.socials?.facebook?.url || '';

document.getElementById('socialXFollowers').value =
  about.socials?.x?.followers || '';

document.getElementById('socialXUrl').value =
  about.socials?.x?.url || '';

document.getElementById('socialTiktokFollowers').value =
  about.socials?.tiktok?.followers || '';

document.getElementById('socialTiktokUrl').value =
  about.socials?.tiktok?.url || '';

  const tickerRes = await fetch('/api/admin/ticker');
const ticker = await tickerRes.json();

document.getElementById('tickerText').value =
  ticker.text || '';

document.getElementById('tickerActive').checked =
  Boolean(ticker.active);
      const adsRes = await fetch('/api/admin/ads');
adsItems = await adsRes.json();

if (!Array.isArray(adsItems)) {
  adsItems = [];
}

renderAdsList();
const galleryRes = await fetch('/api/admin/gallery');
galleryItems = await galleryRes.json();
renderGalleryList();

     
    } catch (error) {
      console.error('Error cargando datos del panel:', error);
      alert('Error cargando datos del panel. Mira la consola del navegador.');
    }
  }
async function saveCalendar() {
  try {
    const calendar = JSON.parse(document.getElementById('calendarJson').value);

    await fetch('/api/admin/calendar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(calendar)
    });

    document.getElementById('calendarMsg').innerText = 'Calendario guardado';
  } catch (error) {
    alert('El JSON del calendario no es válido. Revisa comas, llaves y comillas.');
  }
}
async function saveStandings() {
  try {
    const standings = JSON.parse(document.getElementById('standingsJson').value);

    await fetch('/api/admin/standings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(standings)
    });

    document.getElementById('standingsMsg').innerText = 'Clasificación guardada';
  } catch (error) {
    alert('El JSON de clasificación no es válido. Revisa comas, llaves y comillas.');
  }
}

async function saveNews() {
  try {
    const news = JSON.parse(document.getElementById('newsJson').value);

    await fetch('/api/admin/news', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(news)
    });

    document.getElementById('newsMsg').innerText = 'Noticias guardadas';
  } catch (error) {
    alert('El JSON de noticias no es válido.');
  }
}
function renderGalleryList() {
  const container = document.getElementById('galleryList');

  if (!galleryItems.length) {
    container.innerHTML = '<p>No hay imágenes todavía.</p>';
    return;
  }

  container.innerHTML = galleryItems.map((item, index) => `
    <div style="display:flex; gap:12px; align-items:center; border:1px solid #ddd; border-radius:12px; padding:10px; margin-bottom:10px;">
      <img src="${item.image}" style="width:90px; height:70px; object-fit:cover; border-radius:8px;" />

      <div style="flex:1;">
        <strong>${item.title}</strong><br/>
        <small>Categoría: ${item.category}</small><br/>
        <small>Tipo: ${item.type || 'Normal'}</small>
      </div>

      <button onclick="deleteGalleryImage(${index})" style="background:#c62828;">
        Eliminar
      </button>
    </div>
  `).join('');
}

function addGalleryImage() {
  const title = document.getElementById('galleryTitle').value.trim();
  const category = document.getElementById('galleryCategory').value;
  const type = document.getElementById('galleryType').value;
  const image = document.getElementById('galleryImage').value.trim();

  if (!title || !category || !image) {
    alert('Rellena título, categoría y URL de imagen.');
    return;
  }

  galleryItems.push({
    id: `${category}-${Date.now()}`,
    title,
    category,
    type,
    image
  });

  document.getElementById('galleryTitle').value = '';
  document.getElementById('galleryImage').value = '';
  document.getElementById('galleryType').value = '';

  renderGalleryList();
saveGallery();
}

async function deleteGalleryImage(index) {
  if (!confirm('¿Eliminar esta imagen de la galería?')) return;

  galleryItems.splice(index, 1);

  renderGalleryList();

  await saveGallery();
}
async function saveGallery() {
  try {
    const response = await fetch('/api/admin/gallery', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(galleryItems)
    });

    const result = await response.json();

    console.log('RESULTADO GALERÍA:', result);

    if (!response.ok) {
      alert('Error guardando galería: ' + (result.error || 'Error desconocido'));
      return;
    }

    document.getElementById('galleryMsg').innerText =
      'Galería guardada correctamente';
  } catch (error) {
    console.error('ERROR SAVE GALLERY:', error);
    alert('No se pudo guardar la galería.');
  }
}
  async function saveNextMatch() {
    const payload = {
      teamName: document.getElementById('teamName').value,
      opponent: document.getElementById('opponent').value,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      stadium: document.getElementById('stadium').value,
      competition: document.getElementById('competition').value,
      teamLogo: document.getElementById('teamLogo').value,
      opponentLogo: document.getElementById('opponentLogo').value
    };

    await fetch('/api/admin/next-match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    document.getElementById('nextMatchMsg').innerText = 'Próximo partido guardado';
  }

async function saveAbout() {
  const payload = {
    history: {
      title: document.getElementById('aboutTitle').value,
      text: document.getElementById('aboutText').value
    },

    team: {
      founderName: document.getElementById('founderName').value,
      founderRole: document.getElementById('founderRole').value,
      founderText: document.getElementById('founderText').value,

      partnerName: document.getElementById('partnerName').value,
      partnerRole: document.getElementById('partnerRole').value,
      partnerText: document.getElementById('partnerText').value
    },

    collaborate: {
      title: document.getElementById('collaborateTitle').value,
      text: document.getElementById('collaborateText').value,
      monthlyViews: document.getElementById('monthlyViews').value,
      totalFollowers: document.getElementById('totalFollowers').value,
      instagramFollowers: document.getElementById('instagramFollowers').value,
      services: document.getElementById('collaborateServices').value,
      contactEmail: document.getElementById('contactEmail').value
    },

    socials: {
      instagram: {
        followers: document.getElementById('socialInstagramFollowers').value,
        url: document.getElementById('socialInstagramUrl').value
      },

      facebook: {
        followers: document.getElementById('socialFacebookFollowers').value,
        url: document.getElementById('socialFacebookUrl').value
      },

      x: {
        followers: document.getElementById('socialXFollowers').value,
        url: document.getElementById('socialXUrl').value
      },

      tiktok: {
        followers: document.getElementById('socialTiktokFollowers').value,
        url: document.getElementById('socialTiktokUrl').value
      }
    }
  };

  try {
    const response = await fetch('/api/admin/about', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (!response.ok) {
      alert(
        'Error guardando Quiénes somos: ' +
        (result.error || 'Error desconocido')
      );
      return;
    }

    document.getElementById('aboutMsg').innerText =
      'Sección guardada correctamente';
  } catch (error) {
    console.error('ERROR SAVE ABOUT:', error);
    alert('No se pudo guardar la sección Quiénes somos.');
  }
}
function renderAdsList() {
  const container = document.getElementById('adsList');

  if (!adsItems.length) {
    container.innerHTML = '<p>No hay publicidad actualmente.</p>';
    return;
  }

  container.innerHTML = adsItems.map((item, index) => `
    <div style="display:flex; gap:12px; align-items:center; border:1px solid #ddd; border-radius:12px; padding:10px; margin-bottom:10px;">
      
      <img
        src="${item.image || ''}"
        style="width:90px; height:70px; object-fit:cover; border-radius:8px;"
      />

      <div style="flex:1;">
        <strong>${item.title || 'Sin título'}</strong><br/>
        <small>${item.text || ''}</small>
      </div>

      <button
        onclick="deleteAd(${index})"
        style="background:#c62828; margin:0;"
      >
        Eliminar
      </button>

    </div>
  `).join('');
}

function addAd() {
  const image = document.getElementById('adImage').value.trim();
  const title = document.getElementById('adTitle').value.trim();
  const text = document.getElementById('adText').value.trim();
  const link = document.getElementById('adLink').value.trim();

  if (!image && !title && !text && !link) {
    alert('Rellena al menos un campo del anuncio.');
    return;
  }

  adsItems.push({
    id: String(Date.now()),
    image,
    title,
    text,
    link
  });

  document.getElementById('adImage').value = '';
  document.getElementById('adTitle').value = '';
  document.getElementById('adText').value = '';
  document.getElementById('adLink').value = '';

  renderAdsList();
  saveAds();
}

function deleteAd(index) {
  const confirmed = confirm('¿Quieres eliminar esta publicidad?');

  if (!confirmed) {
    return;
  }

  adsItems.splice(index, 1);

  renderAdsList();
  saveAds();
}

async function saveAds() {
  try {
    const response = await fetch('/api/admin/ads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(adsItems)
    });

    const result = await response.json();

    console.log('ADS GUARDADOS:', result);

    if (!response.ok) {
      alert(
        'Error guardando publicidad: ' +
        (result.error || 'Error desconocido')
      );
      return;
    }

    document.getElementById('adsMsg').innerText =
      'Publicidad guardada correctamente';
  } catch (error) {
    console.error('ERROR SAVE ADS:', error);
    alert('No se pudo guardar la publicidad.');
  }
}

async function saveTicker() {
  try {
    const text = document.getElementById('tickerText').value.trim();
    const active = document.getElementById('tickerActive').checked;

    const response = await fetch('/api/admin/ticker', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        text,
        active
      })
    });

    const result = await response.json();

    if (!response.ok) {
      alert(
        'Error guardando última hora: ' +
        (result.error || 'Error desconocido')
      );
      return;
    }

    document.getElementById('tickerMsg').innerText =
      'Última hora guardada correctamente';
  } catch (error) {
    console.error('ERROR SAVE TICKER:', error);
    alert('No se pudo guardar la última hora.');
  }
}

  window.onload = loadData;
</script>
</body>
</html>
